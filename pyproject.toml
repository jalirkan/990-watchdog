[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog990"
version = "0.1.0"
description = "Public-benefit screening analytics on IRS Form 990 data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
watchdog990 = "watchdog990.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
