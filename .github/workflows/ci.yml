name: CI

# The screen's credibility rests on measurement, so the measurement
# should not depend on one person's laptop. This runs the same check
# the README and the refresh runbook name — `pytest -q`, everything
# green — on every push and pull request against master.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pyproject requires >=3.10; the README recommends 3.12 and that
      # is what the project is developed on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Dependencies come from pyproject.toml. uv.lock is not tracked,
      # so there is nothing pinned to install from here.
      - name: Install
        run: pip install -e ".[dev]"

      # data/raw is a local symlink to an external mount and does not
      # exist in a fresh checkout. The suite is synthetic by design;
      # if a test ever starts reaching for real extracts, this fails.
      - name: Tests
        run: pytest -q

      # "no downloads, no network" is a claim every test file makes in
      # its docstring. Re-run the suite with no network interfaces at
      # all so the claim is checked rather than trusted. This proves
      # the tests, not the install above, which of course needs pip.
      - name: Tests, offline
        # The suite is synthetic and must need no network. An unprivileged
        # network namespace would be the cleanest proof, but GitHub's runner
        # refuses it (unshare cannot write /proc/self/uid_map), so the denial
        # happens in-process instead: a sitecustomize that makes every socket
        # raise. Same claim, checked a way that works here.
        run: |
          mkdir -p "$RUNNER_TEMP/nonet"
          cat > "$RUNNER_TEMP/nonet/sitecustomize.py" <<'PY'
          """Refuse every socket: these tests are synthetic by construction."""
          import socket


          def _blocked(*_args, **_kwargs):
              raise OSError(
                  "network access attempted; this suite is offline by design")


          socket.socket = _blocked
          socket.create_connection = _blocked
          socket.getaddrinfo = _blocked
          PY
          export PYTHONPATH="$RUNNER_TEMP/nonet"
          if python -c "import socket; socket.socket()" 2>/dev/null; then
            echo "the socket guard did not take effect" >&2
            exit 1
          fi
          echo "socket guard active"
          pytest -q
