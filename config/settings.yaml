# ---------------------------------------------------------------
# 990 Watchdog configuration
# All downstream code reads THIS file, so stale URLs or new
# thresholds are a config change, not a code change.
# ---------------------------------------------------------------

# Where the IRS publishes things (index pages, verified live Jul 2026).
# Paste the direct per-year CSV links you download into
# `extract_files` below.
sources:
  soi_extract_index: https://www.irs.gov/statistics/soi-tax-stats-annual-extract-of-tax-exempt-organization-financial-data
  eo_bmf_index: https://www.irs.gov/charities-non-profits/exempt-organizations-business-master-file-extract-eo-bmf
  propublica_api_base: https://projects.propublica.org/nonprofits/api/v2

# Local paths to the files you downloaded (relative to repo root).
# Example:
#   extract_files:
#     2023: data/raw/23eoextract990.csv
extract_files:
  "2024": data/raw/24eoextract990.csv
bmf_files: [data/raw/eo_ny.csv, data/raw/eo_ca.csv]

# Screening thresholds -- judgment calls, documented in docs/methodology.md.
# Tune them openly; a watchdog's credibility lives in its transparency.
thresholds:
  officer_comp_ratio_max: 0.30        # officer comp / total expenses
  program_expense_ratio_min: 0.50     # program expenses / total expenses
  months_net_assets_min: 1.0          # net assets / (expenses/12)
  large_contributions_floor: 1000000  # for the zero-fundraising-cost flag

output_dir: outputs
