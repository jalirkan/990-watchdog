name: CI

# The screen's credibility rests on measurement, so the measurement
# should not depend on one person's laptop. This runs the same check
# the README and the refresh runbook name — `pytest -q`, everything
# green — on every push and pull request against master.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pyproject requires >=3.10; the README recommends 3.12 and that
      # is what the project is developed on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Dependencies come from pyproject.toml. uv.lock is not tracked,
      # so there is nothing pinned to install from here.
      - name: Install
        run: pip install -e ".[dev]"

      # data/raw is a local symlink to an external mount and does not
      # exist in a fresh checkout. The suite is synthetic by design;
      # if a test ever starts reaching for real extracts, this fails.
      - name: Tests
        run: pytest -q

      # "no downloads, no network" is a claim every test file makes in
      # its docstring. Re-run the suite with no network interfaces at
      # all so the claim is checked rather than trusted. This proves
      # the tests, not the install above, which of course needs pip.
      - name: Tests, offline
        # The suite is synthetic and must need no network. An unprivileged
        # network namespace would be the cleanest proof, but GitHub's runner
        # refuses it (unshare cannot write /proc/self/uid_map), so the denial
        # happens in-process instead: a sitecustomize that makes every socket
        # raise. Same claim, checked a way that works here.
        run: |
          mkdir -p "$RUNNER_TEMP/nonet"
          cat > "$RUNNER_TEMP/nonet/sitecustomize.py" <<'PY'
          """Refuse any socket that would leave this machine.

          Replacing socket.socket outright is tempting and wrong: ssl.py does
          `class SSLSocket(socket)` at import time, so a function in that slot
          breaks `import ssl` with a TypeError that has nothing to do with the
          code under test. Guarding the operations that actually reach the
          network leaves the type hierarchy intact.
          """
          import socket

          _LOCAL = {"127.0.0.1", "::1", "localhost", "ip6-localhost", "", None}
          _getaddrinfo = socket.getaddrinfo
          _connect = socket.socket.connect
          _connect_ex = socket.socket.connect_ex


          def _refuse(host):
              raise OSError(
                  "network access attempted to %r; this suite is offline by "
                  "design" % (host,))


          def _guarded_getaddrinfo(host, *a, **k):
              if host not in _LOCAL:
                  _refuse(host)
              return _getaddrinfo(host, *a, **k)


          def _guarded_connect(self, address):
              if isinstance(address, tuple) and address and address[0] not in _LOCAL:
                  _refuse(address[0])
              return _connect(self, address)


          def _guarded_connect_ex(self, address):
              if isinstance(address, tuple) and address and address[0] not in _LOCAL:
                  _refuse(address[0])
              return _connect_ex(self, address)


          socket.getaddrinfo = _guarded_getaddrinfo
          socket.socket.connect = _guarded_connect
          socket.socket.connect_ex = _guarded_connect_ex
          PY
          export PYTHONPATH="$RUNNER_TEMP/nonet"
          python - <<'PY'
          import socket, ssl, sys  # ssl must still import
          try:
              socket.getaddrinfo("example.com", 80)
          except OSError:
              pass
          else:
              sys.exit("guard did not take effect: DNS still resolves")
          print("socket guard active; ssl imports")
          PY
          pytest -q
